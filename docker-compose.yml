# KCloud Monitor v2 (scaffold)
# Host network mode as requested

services:
  # KCloud Monitor API
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: 3.12
    container_name: kcloud-monitor-api
    env_file:
      - .env
    environment:
      # Override defaults at runtime if needed
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      API_AUTH_USERNAME: ${API_AUTH_USERNAME:-admin}
      API_AUTH_PASSWORD: ${API_AUTH_PASSWORD:-changeme}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./app:/app/app:ro
    ports:
      - "0.0.0.0:${PORT:-8000}:${PORT:-8000}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/api/v2/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

# Usage:
# 1. Copy .env.example to .env and adjust credentials.
# 2. Run: docker-compose up -d
# 3. Verify health: curl http://localhost:8000/api/v2/system/health
